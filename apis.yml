description: Atypical AI is an artificial-intelligence and learning-science lab building
  generative-AI learning products for educators, learners, and content creators. Its flagship
  product, ExamJam, is an AI tutor that pairs adaptive, personalized tutoring with trusted
  exam content from major publishers (Pearson, McGraw Hill, Collins) to help students prepare
  for and revise toward their exams. Founded in 2023 and based in San Francisco, the woman-owned
  company builds personalized tutoring, exam preparation, content creation, collaboration, and
  student-success measurement tools grounded in learning science. This profile was surfaced as
  a portfolio company of bloomberg-beta; it publishes a consumer product surface (web + mobile)
  and no public developer API at this time.
